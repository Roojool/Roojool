  <path d="M 948 24 L 948 12 L 936 12" fill="none" stroke="#0969da" stroke-width="2"/>
  <path d="M 12 206 L 12 218 L 24 218" fill="none" stroke="#0969da" stroke-width="2"/>
  <path d="M 948 206 L 948 218 L 936 218" fill="none" stroke="#0969da" stroke-width="2"/>

  <!-- Top Metadata Bar -->
