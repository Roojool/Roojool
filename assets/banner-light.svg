    <linearGradient id="headerGrad_light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a7f37" stop-opacity="0.8"/>
