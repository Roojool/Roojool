<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280" style="background:transparent;">
  <!-- Terminal Window Outer Container -->
  <rect width="958" height="278" x="1" y="1" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Terminal Window Chrome / Header Bar -->
  <rect width="958" height="38" x="1" y="1" rx="8" fill="#eef1f4"/>
  <rect width="958" height="12" x="1" y="27" fill="#eef1f4"/>
  <line x1="1" y1="39" x2="959" y2="39" stroke="#d0d7de" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="20" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="80" y="24" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#57606a">rujul@lab-workstation: ~/identity.sh --dossier</text>
  <text x="820" y="24" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1a7f37">● SYSTEM_ACTIVE</text>

  <!-- Prompt Command Line -->
  <g transform="translate(24, 66)">
    <text font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1a7f37">rujul@research</text>
    <text x="110" y="0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#57606a">:</text>
    <text x="120" y="0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0969da">~</text>
    <text x="130" y="0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#57606a">$ sysinfo --target=rujul-talekar --spec=full</text>
  </g>

  <!-- Horizontal Rule inside Terminal -->
  <line x1="24" y1="80" x2="936" y2="80" stroke="#d0d7de" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- Key-Value Telemetry Block -->
  <g transform="translate(24, 108)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve">
    <!-- Row 1 -->
    <text x="0" y="0" fill="#0550ae" font-weight="600">ROLE</text>
    <text x="120" y="0" fill="#57606a">::</text>
    <text x="145" y="0" fill="#1f2328" font-weight="600">AI Researcher × Systems Builder</text>

    <!-- Row 2 -->
    <text x="0" y="24" fill="#0550ae" font-weight="600">AFFILIATION</text>
    <text x="120" y="24" fill="#57606a">::</text>
    <text x="145" y="24" fill="#1f2328">B.Tech Computer Engineering, Vishwakarma Institute of Technology (VIT Pune)</text>

    <!-- Row 3 -->
    <text x="0" y="48" fill="#0550ae" font-weight="600">LAB GROUP</text>
    <text x="120" y="48" fill="#57606a">::</text>
    <text x="145" y="48" fill="#1f2328">Research Intern under Prof. Ganesh Bhutkar — Usability of AI ICT Applications</text>

    <!-- Row 4 -->
    <text x="0" y="72" fill="#0550ae" font-weight="600">CORE FOCUS</text>
    <text x="120" y="72" fill="#57606a">::</text>
    <text x="145" y="72" fill="#1f2328">Human-Centered AI · Video Management Systems · Computer Vision · Network Systems</text>

    <!-- Row 5 -->
    <text x="0" y="96" fill="#0550ae" font-weight="600">PATENT PUB</text>
    <text x="120" y="96" fill="#57606a">::</text>
    <text x="145" y="96" fill="#116329">Personalized Voice Control Car [Electronics // Filed Dec 2025 // Pub Jan 2026]</text>

    <!-- Row 6 -->
    <text x="0" y="120" fill="#0550ae" font-weight="600">ENG PRINCIPLE</text>
    <text x="120" y="120" fill="#57606a">::</text>
    <text x="145" y="120" fill="#1f2328">Measure before claiming · Characterize queues &amp; pipelines · Defensible evidence</text>

    <!-- Row 7 -->
    <text x="0" y="144" fill="#0550ae" font-weight="600">LOCATION</text>
    <text x="120" y="144" fill="#57606a">::</text>
    <text x="145" y="144" fill="#57606a">Pune, Maharashtra, India [UTC+05:30 IST]  |  Scheduled CHIuXD '26 Presentation</text>
